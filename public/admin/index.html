nd:white;min-width:180px}.media-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.media{background:white;border:1px solid #dce6ed;border-radius:13px;overflow:hidden}.media img{display:block;width:100%;height:135px;object-fit:cover;background:#e7edf2}.media .meta{padding:12px;word-break:break-word;font-size:12px}.media .meta strong{display:block;margin-bottom:9px}.editor{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px}.editor .card{min-width:0}.preview{border:1px solid #d9e5ee;border-radius:12px;padding:22px;background:#f7fafc;line-height:1.7;overflow-wrap:anywhere}.preview h2{font-family:Georgia,serif;font-size:28px;line-height:1.2}.preview img{max-width:100%;border-radius:10px}.preview .bodycopy{white-space:pre-wrap}.notice{margin-top:12px;font-size:12px;color:#738698}.mobile-toggle{display:none}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:#0b253a}.login .card{width:min(440px,100%);padding:36px}.login h1{margin:0 0 8px}.login .btn{width:100%}.login .note{margin-top:18px}.toast{position:fixed;bottom:22px;right:22px;z-index:10;background:#102e44;color:white;padding:13px 18px;border-radius:11px;box-shadow:0 8px 30px #0003;max-width:350px}.hidden{display:none!important}@media(max-width:1100px){.stats{grid-template-columns:repeat(2,1fr)}.media-grid{grid-template-columns:repeat(3,1fr)}.editor{grid-template-columns:1fr}}@media(max-width:760px){.layout{grid-template-columns:1fr}.side{position:fixed;z-index:6;transform:translateX(-105%);transition:transform .2s;width:260px;box-shadow:12px 0 40px #0002}.layout.menu-open .side{transform:none}.mobile-toggle{display:inline-block}.top{height:72px;padding:0 16px;gap:10px}.top h1{font-size:17px}.content{padding:20px 14px 55px}.grid,.stats{grid-template-columns:1fr}.media-grid{grid-template-columns:repeat(2,1fr)}.item{align-items:flex-start;flex-direction:column}.section-heading{align-items:flex-start;flex-direction:column}.card{padding:18px}}@media(max-width:440px){. </style></head><body><div id="app"></div><script>
"use strict";
const KEYS={data:"relato_admin_demo_v2",session:"relato_admin_demo_session"};
const catalog=[
["home","Inicio","Portada y secciones actuales",["Hero: Tu experiencia tiene valor","Soluciones según objetivo","Cuatro servicios","Resultados destacados","Rodrigo Barría","Noticias, tendencias y tips de LinkedIn","Contacto y agenda"]],
["soluciones","Soluciones","Tres objetivos profesionales",["Mejorar oportunidades laborales","Conseguir oportunidades de negocio","Posicionarme como referente"]],

"Método RUTA: Unificar":"Ordenar el relato y optimizar el perfil.",

};
const defaults=()=>({pages:Object.fromEntries(catalog.map(([key,label,desc,items])=>[key,{label,desc,items:items.map((title,i)=>({id:key+"-"+i,title,subtitle:"",description:descriptions[title]||"",button:"",url:title.startsWith("Agendamiento:")?"https://calendar.app.google/K8EH7bzSrJ4ApRGr5":"",image:title.startsWith("Fotografía:")?"/rodrigo.webp":"",visible:true}))}])),posts:[{id:"post-demo-1",title:"¿Por qué la consultoría de marca personal se ha convertido en una herramienta estratégica para profesionales y ejecutivos?",category:"Consultoría de marca personal",excerpt:"Posicionamiento profesional y liderazgo en LinkedIn.",body:"Contenido de referencia del sitio público. Consultar el artículo completo en la web.",status:"borrador",image:"",date:"2026-10-29",slug:"consultoria-marca-personal"}],media:[{id:"media-rodrigo",name:"Rodrigo Barría",data:"/rodrigo.webp"}],settings:{siteName:"Relato Estratégico",email:"contacto@relatoestrategico.cl",whatsapp:"+56 9 5085 9889",calendar:"https://calendar.app.google/K8EH7bzSrJ4ApRGr5",linkedin:"https://www.linkedin.com/in/rodrigobarriareyes/",instagram:"https://www.instagram.com/relatoestrategico/",location:"Santiago, Chile",seoTitle:"Relato Estratégico | Posicionamiento y estrategia en LinkedIn",seoDescription:"Estrategia editorial y posicionamiento en LinkedIn para profesionales y ejecutivos.",ogImage:""},users:[{name:"Administrador demo",email:"admin@demo.local",role:"Administrador",active:true}],activity:[]});
let data;try{data=JSON.parse(localStorage.getItem(KEYS.data))||defaults()}catch{data=defaults()}
let state={view:"dashboard",page:"home",edit:null,post:null,search:""};
const el=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const save=()=>{try{localStorage.setItem(KEYS.data,JSON.stringify(data));return true}catch{toast("Almacenamiento local lleno. Exportá un respaldo y quitá imágenes pesadas.");return false}};
function log(msg){data.activity.unshift({msg,at:new Date().toLocaleString("es-CL")});data.activity=data.activity.slice(0,30);save()}
function toast(msg){document.querySelector(".toast")?.remove();let n=document.createElement("div");n.className="toast";n.textContent=msg;document.body.append(n);setTimeout(()=>n.remove(),3600)}
function field(label,name,value="",type="text"){return '<label class="field"><span>'+esc(label)+'</span>'+(type==="textarea"?'<textarea name="'+esc(name)+'">'+esc(value)+'</textarea>':type==="select"?'<select name="'+esc(name)+'">'+value+'</select>':'<input type="'+esc(type)+'" name="'+esc(name)+'" value="'+esc(value)+'">')+'</label>'}
const opts=(values,current)=>values.map(v=>'<option value="'+esc(v)+'" '+(v===current?"selected":"")+'>'+esc(v)+'</option>').join("");
function render(){if(sessionStorage.getItem(KEYS.session)!=="yes"){document.body.innerHTML='<div class="login"><div class="card"><span class="tag">PROTOTIPO SIN AUTENTICACIÓN REAL</span><h1>Relato Estratégico.</h1><p class="muted">Panel administrativo · demostración funcional</p>'+field("Correo de demostración","email","admin@demo.local")+field("Contraseña de demostración","password","","password")+'<button class="btn" id="demo-login">Entrar a la demo</button><div class="note">Este acceso no valida identidades. No ingreses contraseñas reales ni datos sensibles. Supabase Auth se integrará después.</div><a href="/">← Volver al sitio</a></div></div>';el("demo-login").onclick=()=>{sessionStorage.setItem(KEYS.session,"yes");location.reload()};return}
const menus=[["dashboard","◫","Resumen"],["pages","▤","Páginas y Home"],["posts","✎","Blog y artículos"],["media","▧","Multimedia"],["seo","⌕","SEO y metadatos"],["settings","⚙","Contacto y ajustes"],["users","♙","Usuarios y permisos"],["backup","⇩","Respaldos"]];
document.body.innerHTML='<div class="layout" id="layout"><aside class="side"><div class="brand">Relato<span>Estratégico.</span></div><div class="demo">PANEL DEMO · DATOS DE REFERENCIA · SIN SINCRONIZACIÓN</div><nav class="nav">'+menus.map(([id,icon,label])=>'<button data-nav="'+id+'" class="'+(state.view===id?"active":"")+'"><span>'+icon+'</span>'+label+'</button>').join("")+'</nav><div class="side-bottom">Cambios guardados solo en este navegador.<br>No se publica nada en el sitio real.<br><br><a href="/" target="_blank" rel="noopener">↗ Ver web pública</a><br><button class="btn secondary" id="logout" style="margin-top:12px">Salir de demo</button></div></aside><div class="main"><header class="top"><div class="actions" style="align-items:center"><button class="btn secondary mobile-toggle" id="toggle">☰</button><div><h1>'+esc(menus.find(m=>m[0]===state.view)?.[2]||"Administración")+'</h1><small>Gestión de contenido · vista de demostración</small></div></div><span class="pill">● Modo demo local</span></header><div class="content"><div class="note"><strong>Entorno de prueba.</strong> Guardar, publicar, subir imágenes y gestionar usuarios se simula en este navegador. Los cambios no llegan a la web pública ni a Supabase.</div><div id="screen"></div></div></div></div>';
document.querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>{state.view=b.dataset.nav;state.edit=null;state.post=null;render()});el("logout").onclick=()=>{sessionStorage.removeItem(KEYS.session);location.reload()};el("toggle").onclick=()=>el("layout").classList.toggle("menu-open");show()}
function show(){const root=el("screen");if(!root)return;({dashboard, pages,posts,media,seo,settings,users,backup}[state.view]||dashboard)(root)}
function dashboard(root){let published=data.posts.filter(p=>p.status==="publicado").length;root.innerHTML='<div class="stats"><div class="stat"><span>Páginas editables</span><strong>'+catalog.length+'</strong><span>Home y secciones</span></div><div class="stat"><span>Artículos</span><strong>'+data.posts.length+'</strong><span>'+published+' marcados como publicados en demo</span></div><div class="stat"><span>Imágenes cargadas</span><strong>'+data.media.length+'</strong><span>Guardadas localmente</span></div><div class="stat"><span>Usuarios simulados</span><strong>'+data.users.length+'</strong><span>Sin permisos reales</span></div></div><div class="section-heading"><h2>Accesos rápidos</h2></div><div class="grid"><div class="card"><h2>Editar páginas</h2><p>Gestioná títulos, descripciones, enlaces y visibilidad de cada bloque.</p><button class="btn" data-go="pages">Abrir editor de páginas</button></div><div class="card"><h2>Publicar un artículo</h2><p>Prepará artículos con portada, categoría, extracto y contenido.</p><button class="btn" data-go="posts">Gestionar blog</button></div><div class="card"><h2>Biblioteca de imágenes</h2><p>Subí imágenes de prueba y asigná su dirección a contenidos.</p><button class="btn" data-go="media">Abrir multimedia</button></div><div class="card"><h2>Antes de integrar</h2><p>Validar diseño, formularios, roles, borradores y flujo de publicación. Luego conectar Supabase Auth, PostgreSQL y Storage.</p><button class="btn secondary" data-go="backup">Exportar datos demo</button></div></div><div class="section-heading"><h2>Actividad reciente</h2></div><div class="card">'+(data.activity.length?data.activity.slice(0,6).map(x=>'<p><strong>'+esc(x.msg)+'</strong> <small>'+esc(x.at)+'</small></p>').join(""):'<p>Todavía no hay cambios en esta demo.</p>')+'</div>';root.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{state.view=b.dataset.go;render()})}
function pages(root){if(state.edit!==null)return pageEditor(root);root.innerHTML='<div class="section-heading"><h2>Contenido editable del sitio</h2><span class="muted">Seleccioná una página</span></div><div class="grid">'+catalog.map(([id,label,desc])=>'<div class="card"><span class="tag">'+esc(id.toUpperCase())+'</span><h2 style="margin-top:15px">'+esc(label)+'</h2><p>'+esc(desc)+'</p><p>'+data.pages[id].items.length+' bloques editables</p><button class="btn" data-page="'+id+'">Administrar contenido →</button></div>').join("")+'</div>';root.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>{state.page=b.dataset.page;state.edit="list";show()})}
function pageEditor(root){const page=data.pages[state.page];if(state.edit!=="list"){const item=page.items.find(i=>i.id===state.edit);if(!item){state.edit="list";return pageEditor(root)}root.innerHTML='<div class="section-heading"><h2>Editar: '+esc(item.title)+'</h2><button class="btn secondary" id="back">← Volver</button></div><div class="editor"><form class="card" id="page-form">'+field("Título", "title",item.title)+field("Subtítulo o pregunta","subtitle",item.subtitle)+field("Texto explicativo","description",item.description,"textarea")+field("Texto del botón","button",item.button)+field("Enlace del botón","url",item.url)+field("URL de imagen","image",item.image)+field("Visibilidad","visible",opts(["Visible","Oculto"],item.visible?"Visible":"Oculto"),"select")+'<div class="actions"><button class="btn" type="submit">Guardar cambios demo</button><button type="button" class="btn secondary" id="preview">Vista previa</button></div></form><div class="card"><h3>Vista previa del bloque</h3><div class="preview" id="page-preview"></div><p class="notice">El contenido solo se actualiza en la demo. La web pública no cambia.</p></div></div>';const form=el("page-form");const get=()=>Object.fromEntries(new FormData(form));const preview=()=>{const x=get();el("page-preview").innerHTML=(x.image?'<img alt="" src="'+esc(x.image)+'">':"")+'<h2>'+esc(x.title)+'</h2><strong>'+esc(x.subtitle)+'</strong><p class="bodycopy">'+esc(x.description)+'</p>'+(x.button?'<span class="tag">'+esc(x.button)+'</span>':"")};form.onsubmit=e=>{e.preventDefault();Object.assign(item,get(),{visible:get().visible==="Visible"});log("Bloque actualizado: "+item.title);toast("Cambios guardados en la demo");preview()};el("preview").onclick=preview;el("back").onclick=()=>{state.edit="list";show()};preview();return}
root.innerHTML='<div class="section-heading"><div><h2>'+esc(page.label)+'</h2><p class="muted">'+esc(page.desc)+'</p></div><div class="actions"><button class="btn secondary" id="back">← Páginas</button><button class="btn" id="add">+ Nuevo bloque</button></div></div><div class="list">'+page.items.map((x,i)=>'<div class="item"><div><strong>'+esc(x.title)+'</strong><small>Bloque '+(i+1)+' · '+(x.visible?"Visible":"Oculto")+'</small></div><div class="actions"><button class="btn secondary" data-edit="'+esc(x.id)+'">Editar</button><button class="btn secondary" data-move="'+esc(x.id)+'" data-dir="-1" aria-label="Mover arriba">↑</button><button class="btn secondary" data-move="'+esc(x.id)+'" data-dir="1" aria-label="Mover abajo">↓</button><button class="btn danger" data-delete="'+esc(x.id)+'">Eliminar</button></div></div>').join("")+'</div>';el("back").onclick=()=>{state.edit=null;show()};el("add").onclick=()=>{const id=uid();page.items.push({id,title:"Nuevo bloque",subtitle:"",description:"",button:"",url:"",image:"",visible:true});log("Bloque creado en "+page.label);state.edit=id;show()};root.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{state.edit=b.dataset.edit;show()});root.querySelectorAll("[data-delete]").forEach(b=>b.onclick=()=>{if(confirm("¿Eliminar este bloque de la demo?")){page.items=page.items.filter(x=>x.id!==b.dataset.delete);log("Bloque eliminado de "+page.label);show()}});root.querySelectorAll("[data-move]").forEach(b=>b.onclick=()=>{const i=page.items.findIndex(x=>x.id===b.dataset.move),j=i+Number(b.dataset.dir);if(j>=0&&j<page.items.length){[page.items[i],page.items[j]]=[page.items[j],page.items[i]];save();show()}})}
function posts(root){if(state.post!==null)return postEditor(root);root.innerHTML='<div class="section-heading"><h2>Artículos del blog</h2><button class="btn" id="add-post">+ Nuevo artículo</button></div><div class="toolbar"><input id="post-search" placeholder="Buscar por título..." value="'+esc(state.search)+'"><select id="post-filter"><option value="">Todos los estados</option><option value="borrador">Borrador</option><option value="publicado">Publicado (demo)</option></select></div><div class="list" id="post-list"></div>';el("add-post").onclick=()=>{let id=uid();data.posts.unshift({id,title:"Artículo sin título",category:"LinkedIn",excerpt:"",body:"",status:"borrador",image:"",date:new Date().toISOString().slice(0,10),slug:"articulo-"+id});save();state.post=id;show()};const paint=()=>{let q=el("post-search").value.toLowerCase(),st=el("post-filter").value;el("post-list").innerHTML=data.posts.filter(p=>p.title.toLowerCase().includes(q)&&(!st||p.status===st)).map(p=>'<div class="item"><div><strong>'+esc(p.title)+'</strong><small>'+esc(p.category)+' · '+esc(p.date)+' · <span class="tag '+(p.status==="borrador"?"draft":"")+'">'+esc(p.status)+'</span></small></div><div class="actions"><button class="btn secondary" data-post="'+esc(p.id)+'">Editar</button><button class="btn danger" data-delete="'+esc(p.id)+'">Eliminar</button></div></div>').join("")||'<div class="empty">No se encontraron artículos.</div>';el("post-list").querySelectorAll("[data-post]").forEach(b=>b.onclick=()=>{state.post=b.dataset.post;show()});el("post-list").querySelectorAll("[data-delete]").forEach(b=>b.onclick=()=>{if(confirm("¿Eliminar artículo de la demo?")){data.posts=data.posts.filter(p=>p.id!==b.dataset.delete);log("Artículo eliminado");paint()}})};el("post-search").oninput=paint;el("post-filter").onchange=paint;paint()}
function postEditor(root){const p=data.posts.find(x=>x.id===state.post);if(!p){state.post=null;return posts(root)}root.innerHTML='<div class="section-heading"><h2>Editor de artículos</h2><button class="btn secondary" id="back">← Volver al blog</button></div><div class="editor"><form class="card" id="post-form">'+field("Título","title",p.title)+field("Slug (URL)","slug",p.slug)+field("Categoría","category",p.category)+field("Extracto","excerpt",p.excerpt,"textarea")+field("Contenido del artículo (texto)","body",p.body,"textarea")+field("URL de imagen de portada","image",p.image)+field("Fecha","date",p.date,"date")+field("Estado","status",opts(["borrador","publicado"],p.status),"select")+'<div class="actions"><button class="btn" type="submit">Guardar artículo</button><button class="btn secondary" type="button" id="preview">Actualizar vista previa</button></div><p class="notice">La publicación es simulada: no aparecerá en el blog público.</p></form><div class="card"><h3>Vista previa editorial</h3><div class="preview" id="post-preview"></div></div></div>';const form=el("post-form"),get=()=>Object.fromEntries(new FormData(form));const preview=()=>{const x=get();el("post-preview").innerHTML=(x.image?'<img alt="" src="'+esc(x.image)+'">':"")+'<span class="tag">'+esc(x.category)+'</span><h2>'+esc(x.title)+'</h2><p>'+esc(x.excerpt)+'</p><div class="bodycopy">'+esc(x.body)+'</div>'};form.onsubmit=e=>{e.preventDefault();Object.assign(p,get());log("Artículo guardado: "+p.title+" ("+p.status+")");toast("Artículo guardado en demo");preview()};el("preview").onclick=preview;el("back").onclick=()=>{state.post=null;show()};preview()}
function media(root){root.innerHTML='<div class="section-heading"><h2>Biblioteca multimedia</h2><span class="muted">Almacenamiento local de prueba</span></div><div class="card"><h3>Agregar imagen</h3><p>Usá archivos livianos (recomendado: menos de 400 KB). La versión final usará Supabase Storage.</p><label class="field"><span>Seleccionar imágenes</span><input id="upload" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple></label><p class="notice">Las imágenes se almacenan en este navegador. No uses archivos privados.</p></div><div class="section-heading"><h2>Imágenes cargadas ('+data.media.length+')</h2></div><div class="media-grid">'+data.media.map(m=>'<div class="media"><img src="'+esc(m.data)+'" alt="'+esc(m.name)+'"><div class="meta"><strong>'+esc(m.name)+'</strong><div class="actions"><button class="btn secondary" data-copy="'+esc(m.id)+'">Copiar URL demo</button><button class="btn danger" data-delete="'+esc(m.id)+'">Quitar</button></div></div></div>').join("")+'</div>'+(data.media.length?"":'<div class="empty">Todavía no hay imágenes cargadas.</div>');el("upload").onchange=async e=>{for(const file of e.target.files){if(file.size>400000){toast("Archivo demasiado grande para esta demo: "+file.name);continue}const b64=await new Promise(res=>{const reader=new FileReader();reader.onload=()=>res(reader.result);reader.readAsDataURL(file)});data.media.push({id:uid(),name:file.name,data:b64})}if(save()){log("Biblioteca multimedia actualizada");show()}};root.querySelectorAll("[data-delete]").forEach(b=>b.onclick=()=>{if(confirm("¿Quitar imagen de la demo?")){data.media=data.media.filter(m=>m.id!==b.dataset.delete);log("Imagen eliminada");show()}});root.querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>{const m=data.media.find(m=>m.id===b.dataset.copy);navigator.clipboard?.writeText(m.data).then(()=>toast("URL demo copiada"),()=>toast("No se pudo copiar automáticamente"))})}
function simpleForm(root,title,fields,handler,help){root.innerHTML='<div class="section-heading"><h2>'+esc(title)+'</h2></div><form class="card" id="simple-form">'+fields.map(f=>field(f[0],f[1],data.settings[f[1]],f[2]||"text")).join("")+'<button class="btn" type="submit">Guardar ajustes demo</button><p class="notice">'+esc(help)+'</p></form>';el("simple-form").onsubmit=e=>{e.preventDefault();Object.assign(data.settings,Object.fromEntries(new FormData(e.currentTarget)));log("Configuración actualizada");toast("Configuración guardada en demo")}}
function seo(root){simpleForm(root,"SEO y vista previa para compartir",[["Título SEO","seoTitle"],["Descripción SEO","seoDescription","textarea"],["Imagen Open Graph (URL)","ogImage"]],"Estos valores no modifican los metadatos del sitio público todavía.")}
function settings(root){simpleForm(root,"Configuración y contacto",[["Nombre del sitio","siteName"],["Correo electrónico","email","email"],["WhatsApp","whatsapp"],["Enlace de agendamiento","calendar"]],"Los botones y contactos públicos no cambiarán hasta integrar la fuente de contenido.")}
function users(root){root.innerHTML='<div class="section-heading"><h2>Usuarios y permisos</h2><button class="btn" id="add-user">+ Agregar usuario demo</button></div><div class="note">Roles simulados: Administrador, Editor y Lector. No existe control de acceso real. Se implementará con Supabase Auth y políticas RLS.</div><div class="list">'+data.users.map((u,i)=>'<div class="item"><div><strong>'+esc(u.name)+'</strong><small>'+esc(u.email)+' · '+esc(u.role)+' · '+(u.active?"Activo":"Inactivo")+'</small></div><div class="actions"><button class="btn secondary" data-role="'+i+'">Cambiar rol</button><button class="btn danger" data-remove="'+i+'">Quitar</button></div></div>').join("")+'</div>';el("add-user").onclick=()=>{const name=prompt("Nombre del usuario de prueba");if(!name)return;const email=prompt("Correo de prueba");if(!email)return;data.users.push({name,email,role:"Editor",active:true});log("Usuario demo agregado: "+name);show()};root.querySelectorAll("[data-role]").forEach(b=>b.onclick=()=>{let u=data.users[Number(b.dataset.role)],roles=["Administrador","Editor","Lector"];u.role=roles[(roles.indexOf(u.role)+1)%roles.length];log("Rol demo modificado: "+u.name);show()});root.querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>{if(data.users.length===1)return toast("La demo debe conservar un usuario");if(confirm("¿Quitar usuario demo?")){data.users.splice(Number(b.dataset.remove),1);log("Usuario demo eliminado");show()}})}
function backup(root){root.innerHTML='<div class="section-heading"><h2>Respaldo y restauración</h2></div><div class="grid"><div class="card"><h2>Exportar contenido demo</h2><p>Descargá páginas, artículos, ajustes e imágenes guardadas en el navegador en formato JSON.</p><button class="btn" id="export">Descargar respaldo JSON</button></div><div class="card"><h2>Importar respaldo</h2><p>Restaura un archivo generado por este panel. Reemplazará los datos demo actuales.</p><input type="file" id="import" accept="application/json,.json"></div><div class="card"><h2>Reiniciar demostración</h2><p>Restaurá los datos iniciales. Esta operación elimina los cambios guardados localmente.</p><button class="btn danger" id="reset">Restaurar datos iniciales</button></div><div class="card"><h2>Integración futura</h2><p>Supabase Auth para usuarios, PostgreSQL para contenidos, Storage para imágenes, auditoría de cambios y publicación real tras revisión.</p></div></div>';el("export").onclick=()=>{let blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="relato-estrategico-demo-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};el("import").onchange=async e=>{try{const parsed=JSON.parse(await e.target.files[0].text());if(!parsed.pages||!Array.isArray(parsed.posts)||!Array.isArray(parsed.media)||!parsed.settings)throw Error("Formato no válido");if(confirm("¿Reemplazar los datos demo actuales?")){data=parsed;save();render();toast("Respaldo importado")}}catch{toast("Archivo JSON no válido para este panel")}};el("reset").onclick=()=>{if(confirm("¿Eliminar todos los cambios demo y restaurar los datos iniciales?")){data=defaults();save();render();toast("Datos iniciales restaurados")}}}
render();
</script></body></html>
