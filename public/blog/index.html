<!doctype html><html lang="es-CL"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blog | Relato Estratégico</title><meta name="description" content="Artículos y recursos de marca personal, posicionamiento ejecutivo y LinkedIn."><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#f2f6fa;color:#142b42;font-family:'DM Sans',Arial,sans-serif}a{text-decoration:none;color:inherit}.shell{max-width:1240px;margin:auto;padding:24px 24px 90px}.nav{display:flex;justify-content:space-between;align-items:center;gap:20px;background:#fff;border:1px solid #e2e9f0;border-radius:100px;padding:18px 26px}.brand{font-weight:800;font-size:20px}.nav a:last-child{font-weight:700;color:#1565ae}.eyebrow{color:#1165ba;letter-spacing:.16em;text-transform:uppercase;font-weight:800;font-size:11px}.mast{padding:80px 0 36px}.mast h1{font-size:clamp(42px,6vw,80px);letter-spacing:-.065em;line-height:1.04;max-width:820px;margin:18px 0}.mast p{color:#65788c;font-size:17px;line-height:1.6}.tools{display:flex;align-items:center;justify-content:space-between;gap:18px;margin:12px 0 30px}.tools input{background:white;border:1px solid #d8e3ed;border-radius:9px;padding:15px 18px;font:inherit;min-width:min(100%,360px)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}.card{background:#fff;border:1px solid #e0e9f1;border-radius:14px;overflow:hidden;display:flex;flex-direction:column}.card:hover{border-color:#7da9d5}.card img{display:block;width:100%;height:205px;object-fit:cover}.card .copy{padding:22px;display:flex;flex:1;flex-direction:column}.tag{font-size:11px;color:#1469ba;text-transform:uppercase;letter-spacing:.13em;font-weight:800}.card h2{font-size:21px;letter-spacing:-.035em;line-height:1.25;margin:10px 0}.card p{font-size:14px;line-height:1.6;color:#65788c}.more{margin-top:auto;padding-top:16px;font-size:13px;font-weight:800;color:#1469ba}.article{max-width:840px;margin:65px auto 20px;background:white;border:1px solid #e0e9f1;border-radius:16px;overflow:hidden}.article img{width:100%;max-height:440px;object-fit:cover}.article .body{padding:clamp(24px,5vw,60px)}.article h1{font-size:clamp(34px,4vw,56px);letter-spacing:-.055em;line-height:1.1}.article p{font-size:18px;line-height:1.8;color:#53677a}.note{border-left:3px solid #2778ca;padding:14px 18px;background:#f2f7fc;font-size:14px!important}.cta{display:inline-flex;background:#0c3156;color:white;padding:14px 22px;border-radius:50px;font-size:14px;font-weight:700;margin-top:22px}.back{font-size:14px;font-weight:700;color:#1469ba}footer{border-top:1px solid #dbe4ec;margin-top:70px;padding-top:25px;color:#61778a;font-size:13px;display:flex;justify-content:space-between;gap:20px}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.shell{padding:14px 16px 60px}.nav{padding:16px}.brand{font-size:16px}.mast{padding:52px 0 20px}.grid{grid-template-columns:1fr}.tools{align-items:start;flex-direction:column}.tools input{width:100%}footer{flex-direction:column}}</style></head><body><div class="shell"><nav class="nav"><a class="brand" href="/">Relato Estratégico.</a><a href="/">← Volver al inicio</a></nav><main id="app"></main><footer><span>Relato Estratégico © 2026</span><a href="mailto:contacto@relatoestrategico.cl">contacto@relatoestrategico.cl</a></footer></div><script>const posts=[["consultoria-marca-personal","Consultoría de marca personal","¿Por qué la consultoría de marca personal se ha convertido en una herramienta estratégica para profesionales y ejecutivos?","La importancia de una consultoría de marca personal en LinkedIn como apoyo estratégico en el posicionamiento de profesionales, gerentes y líderes que quieren destacar en su sector.","https://images.unsplash.com/photo-1497366811353-6870744d04b2?auto=format&fit=crop&w=1200&q=82"],["gremios-chilenos-linkedin","Posicionamiento en LinkedIn","¿Cómo es la presencia de los gremios chilenos y sus líderes en LinkedIn?","Los gremios empresariales ya tienen presencia en LinkedIn, pero sus líderes aún tienen una gran oportunidad de fortalecer su visibilidad digital.","https://images.unsplash.com/photo-1556761175-b413da4baf72?auto=format&fit=crop&w=1000&q=80"],["posts-colaborativos","LinkedIn","LinkedIn anuncia los posts colaborativos: ¿qué oportunidades ofrece la nueva funcionalidad?","Las nuevas oportunidades y potencialidades que aparecen con los posts colaborativos en LinkedIn.","https://images.unsplash.com/photo-1531482615713-2afd69097998?auto=format&fit=crop&w=1000&q=80"],["executive-branding","Estrategia","LinkedIn: Executive Branding vs Personal Branding","Las diferencias clave entre marca personal y executive branding, y cómo una estrategia se adapta al posicionamiento profesional.","https://images.unsplash.com/photo-1560250097-0b93528c311a?auto=format&fit=crop&w=1000&q=80"],["embajadores-digitales","Empresas","LinkedIn convierte a tus colaboradores en «embajadores digitales»","Cómo transformar a los colaboradores de tu empresa en embajadores de marca digital que amplifiquen el alcance y la credibilidad de tu organización.","https://images.unsplash.com/photo-1521737711867-e3b97375f902?auto=format&fit=crop&w=1000&q=80"],["optimizar-perfil","LinkedIn","¿Cómo optimizar tu perfil de LinkedIn?","Guía completa paso a paso para transformar tu perfil de LinkedIn en una herramienta de atracción de oportunidades profesionales.","https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=1000&q=80"]];const app=document.getElementById('app');const params=new URLSearchParams(location.search);const slug=params.get('articulo');const escapeHTML=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');function card(p){return '<a class="card" href="/blog/?articulo='+encodeURIComponent(p[0])+'"><img src="'+p[4]+'" alt="" loading="lazy"><div class="copy"><span class="tag">'+escapeHTML(p[1])+'</span><h2>'+escapeHTML(p[2])+'</h2><p>'+escapeHTML(p[3])+'</p><span class="more">Leer resumen ↗</span></div></a>'}if(slug){const p=posts.find(x=>x[0]===slug);if(p){document.title=p[2]+' | Relato Estratégico';app.innerHTML='<article class="article"><img src="'+p[4]+'" alt=""><div class="body"><a class="back" href="/blog/">← Todos los artículos</a><p class="eyebrow">'+escapeHTML(p[1])+'</p><h1>'+escapeHTML(p[2])+'</h1><p>'+escapeHTML(p[3])+'</p><p class="note">Esta página presenta un resumen editorial. El texto completo del artículo aún no se ha incorporado a esta versión del sitio.</p><a class="cta" href="https://relatoestrategico.cl/#blog" target="_blank" rel="noopener noreferrer">Consultar el blog original ↗</a></div></article>'}else{app.innerHTML='<div class="mast"><h1>Artículo no encontrado</h1><a class="back" href="/blog/">Ver todos los artículos →</a></div>'}}else{app.innerHTML='<header class="mast"><span class="eyebrow">Blog · Relato Estratégico</span><h1>Recursos para construir liderazgo en LinkedIn.</h1><p>Marca personal, estrategia editorial y posicionamiento profesional.</p></header><div class="tools"><label for="search">Buscar recursos</label><input id="search" type="search" placeholder="Buscar por tema o título" aria-label="Buscar artículos"><span id="count">6 artículos</span></div><div class="grid" id="grid">'+posts.map(card).join('')+'</div>';document.getElementById('search').addEventListener('input',e=>{const q=e.target.value.toLocaleLowerCase('es');const filtered=posts.filter(p=>(p[1]+' '+p[2]+' '+p[3]).toLocaleLowerCase('es').includes(q));document.getElementById('grid').innerHTML=filtered.map(card).join('')||'<p>No se encontraron artículos.</p>';document.getElementById('count').textContent=filtered.length+' artículos'})}</script></body></html>
