<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; connect-src 'self' https://api.relatoestrategico.cl; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Acceso administrativo | Relato Estratégico</title>
<style>
:root{
  --ink:#13283b;--muted:#6d8091;--line:#e0e7ed;--bg:#f4f6f8;--brand:#0b253a;--brand-2:#1269b1;
  --accent:#63b2ff;--ok:#1d6b3a;--ok-bg:#e9f8ef;--err:#a92e2e;--err-bg:#fff2f2;--warn-bg:#fff7e7;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg);line-height:1.5}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
a{color:inherit}
.hidden{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Layout */
.layout{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
.side{background:var(--brand);color:#dce8f0;padding:28px 16px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-size:22px;font-weight:800;letter-spacing:-.04em;color:#fff;margin:0 10px 26px}
.brand span{color:var(--accent)}
.nav button{display:flex;align-items:center;gap:12px;text-align:left;width:100%;border:0;border-radius:10px;padding:12px;color:#c6d8e5;background:none;margin:3px 0;font-size:14px}
.nav button.active,.nav button:hover{background:#1a425d;color:#fff}
.nav button span{width:24px;text-align:center;font-size:17px}
.side-bottom{border-top:1px solid #315067;margin:24px 10px 0;padding-top:20px;font-size:12px;line-height:1.6;color:#aac1d1}
.side-bottom strong{color:#fff;word-break:break-all}
.side-bottom .btn{margin:12px 0 14px}
.side-bottom a{color:#bfe6ff}
.main{min-width:0}
.top{height:84px;background:#fff;border-bottom:1px solid #e1e7ec;display:flex;justify-content:space-between;align-items:center;padding:0 34px;position:sticky;top:0;z-index:3;gap:12px}
.top h1{font-size:22px;letter-spacing:-.04em;margin:0}
.top small{color:var(--muted)}
.pill{border:1px solid #c7d9e5;background:#f1f7fb;border-radius:30px;padding:8px 12px;font-size:12px;font-weight:700;color:#24628b;white-space:nowrap}
.content{max-width:1380px;margin:auto;padding:30px 34px 80px}
.mobile-toggle{display:none}

/* Componentes */
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:0 4px 20px #12334a06;min-width:0}
.card h2{font-size:19px;margin:0 0 10px}
.card h3{font-size:15px;margin:0 0 12px}
.card p{color:#687d8e;font-size:14px;line-height:1.6}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.stat strong{display:block;font-size:30px;margin:10px 0 2px;letter-spacing:-.05em}
.stat span,.muted{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.section-heading{display:flex;justify-content:space-between;align-items:center;gap:14px;margin:28px 0 17px;flex-wrap:wrap}
.section-heading:first-child{margin-top:0}
.section-heading h2{font-size:23px;letter-spacing:-.04em;margin:0}
.btn{border:0;background:var(--brand);color:#fff;padding:12px 18px;border-radius:10px;font-size:14px;font-weight:700;min-height:44px;display:inline-flex;align-items:center;justify-content:center}
.btn:disabled{opacity:.55}
.btn.secondary{background:#fff;color:#123047;border:1px solid #cfdae3}
.btn.danger{background:var(--err-bg);color:var(--err);border:1px solid #edc9c9}
.btn.small{min-height:36px;padding:8px 12px;font-size:13px}
.btn:focus-visible,.nav button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #58b6ff;outline-offset:2px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.field{display:block;margin:0 0 17px}
.field>span{display:block;font-weight:700;font-size:12px;color:#3e586b;margin-bottom:7px}
.field input,.field textarea,.field select{display:block;width:100%;padding:12px 13px;border:1px solid #cbd8e1;border-radius:9px;color:#16354b;background:#fff;font-size:15px}
.field textarea{min-height:95px;resize:vertical}
.field textarea.tall{min-height:320px}
.field input:disabled,.field textarea:disabled,.field select:disabled{background:#f3f6f8;color:#58707f}
.field .hint{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:6px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0;align-items:center}
.toolbar input,.toolbar select,.inline select{padding:11px;border:1px solid #cbd8e1;border-radius:9px;background:#fff;min-width:180px;font-size:14px}
.list{display:grid;gap:10px}
.item{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:15px 17px;background:#fff;border:1px solid #e1e8ed;border-radius:12px}
.item strong{display:block;font-size:15px;margin-bottom:5px;word-break:break-word}
.item small{color:#758a9a}
.item.muted-block{background:#f7f9fb}
.empty{padding:35px;text-align:center;color:#708698;background:#fff;border:1px dashed #bacbd8;border-radius:14px}
.tag{display:inline-block;padding:4px 9px;border-radius:20px;background:#eaf4fd;color:#1763a0;font-size:11px;font-weight:700}
.tag.draft,.tag.off{background:#fff3d9;color:#916117}
.note{padding:14px 17px;border-radius:13px;background:var(--warn-bg);border:1px solid #eed9aa;color:#76541a;font-size:13px;line-height:1.55;margin:0 0 22px}
.alert{padding:13px 15px;border-radius:11px;font-size:14px;line-height:1.5;margin:0 0 18px;border:1px solid}
.alert.error{background:var(--err-bg);border-color:#edc9c9;color:var(--err)}
.alert.ok{background:var(--ok-bg);border-color:#bfe6cd;color:var(--ok)}
.alert.info{background:#eef6fd;border-color:#c9e1f5;color:#1b5a8c}
.editor{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
.editor>.card{min-width:0}
.preview{border:1px solid #d9e5ee;border-radius:12px;padding:22px;background:#f7fafc;line-height:1.7;overflow-wrap:anywhere}
.preview h2{font-family:Georgia,serif;font-size:26px;line-height:1.2;margin:10px 0}
.preview img{max-width:100%;border-radius:10px}
.preview .body{white-space:pre-wrap}
.toast{position:fixed;bottom:22px;right:22px;z-index:10;background:#102e44;color:#fff;padding:13px 18px;border-radius:11px;box-shadow:0 8px 30px #0003;max-width:360px;font-size:14px}
.form-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:8px}
.media-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.media-card{background:#fff;border:1px solid #dce6ed;border-radius:13px;overflow:hidden;display:flex;flex-direction:column}
.media-card img{display:block;width:100%;height:140px;object-fit:cover;background:#e7edf2}
.media-card .meta{padding:12px;font-size:12px;word-break:break-word;display:grid;gap:8px}
.media-card .meta strong{font-size:13px}
.users-table-note{font-size:12px;color:var(--muted)}
.badge{display:inline-block;background:#184a6c;color:#bfe6ff;font-size:11px;font-weight:800;letter-spacing:.1em;padding:6px 10px;border-radius:7px}

/* Acceso */
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--brand)}
.login-card{width:min(440px,100%);padding:36px}
.login-card h1{margin:12px 0 4px;font-size:30px;letter-spacing:-.04em}
.login-card .btn{width:100%}
.link-row{margin:16px 0 4px;font-size:14px}
.link-row a{color:var(--brand-2);font-weight:700}
.back-link{display:inline-block;margin-top:18px;font-size:14px;color:#4a6276}

@media(max-width:1100px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .editor{grid-template-columns:1fr}
  .media-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media(max-width:760px){
  .layout{grid-template-columns:1fr}
  .side{position:fixed;z-index:6;transform:translateX(-105%);transition:transform .2s;width:260px;box-shadow:12px 0 40px #0002}
  .layout.menu-open .side{transform:none}
  .mobile-toggle{display:inline-flex}
  .top{height:auto;min-height:72px;padding:12px 16px;z-index:7}
  .top h1{font-size:17px}
  .content{padding:20px 16px 60px}
  .grid,.stats{grid-template-columns:1fr}
  .media-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .item{align-items:flex-start;flex-direction:column}
  .section-heading{align-items:flex-start;flex-direction:column}
  .card{padding:18px}
  .toolbar input,.toolbar select{min-width:0;width:100%}
  .login-card{padding:26px 20px}
}
@media(max-width:440px){
  .top .pill{display:none}
  .media-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="app"><div class="login-wrap"><div class="card login-card"><p class="muted">Cargando…</p></div></div></div>
<script src="app.js" defer></script>
</body>
</html>
